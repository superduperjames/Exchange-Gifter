
<!DOCTYPE html>
<html lang="en">
<head>
  
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Meddon&display=swap" rel="stylesheet">
  <link href="'https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">


  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exchange Gift Form</title>

  <style>
    :root {
      --blue: #376E9D;
      --red: #E2403E;
      --yellow: #DEAC2F;
      --green: #7FA347;
      --dark: #242424;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
    }


body {
  margin: 0;
  min-height: 100vh;
  padding: 55px 20px 40px;
  font-family: 'Poppins', sans-serif;
  font-weight: 400;
  color: #242424;

      /* Replace with your original Cloudinary background image URL. */
      background-image:url("https://res.cloudinary.com/dzjdhooce/image/upload/v1791579014/103_christmas_u4umt2.png");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
    }


h1 {
  margin: 10px 0 30px;
  text-align: center;
  color: #C28851;
  font-family: "Meddon", cursive;
  font-size: 3em;
  font-weight: 700;
  line-height: 1.2;
  text-shadow: 2px 2px 0 rgba(222, 172, 47, 0.25);
}


    .container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding: 35px;
      background: rgba(255, 255, 255, .96);
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, .16);
    }

    .intro {
      margin: 0 0 25px;
      text-align: center;
      line-height: 1.6;
      color: #555;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
      color: #BA1E3C;
    }

    input,
    select,
    textarea {
      display: block;
      width: 100%;
      min-width: 0;
      padding: 13px 14px;
      border: 1px solid #ccd3d9;
      border-radius: 9px;
      background: #fff;
      color: var(--dark);
      font: inherit;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }

    textarea {
      min-height: 85px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(55, 110, 157, .13);
    }

    .form-buttons {
      display: flex;
      gap: 12px;
      width: 100%;
      margin-top: 25px;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 15px 18px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s, transform .15s, opacity .2s;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .form-buttons button {
      flex: 1;
      min-width: 0;
      margin: 0;
    }

    #submitButton {
      background:#086C50;
      color: var(--white);
    }

    #submitButton:hover:not(:disabled) {
      background: #12B975;
    }

    #editWishlistButton {
      background:#D81B3E;
      color: var(--white);
    }

    #editWishlistButton:hover:not(:disabled) {
      background:#FA4B70;
      color: var(--white);
    }

    .admin-login {
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 5;
      padding: 8px 13px;
      border-radius: 7px;
      background: rgba(255, 255, 255, .9);
      color: var(--blue);
      font-size: .8em;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
    }

    /* General submission and duplicate-warning modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, .55);
    }

    .modal-content {
      width: 100%;
      max-width: 430px;
      padding: 30px;
      border-radius: 15px;
      background: #fff;
      text-align: center;
      font-size: 1.05em;
      line-height: 1.6;
      overflow-wrap: anywhere;
      box-shadow: 0 10px 35px rgba(0, 0, 0, .2);
    }

    .modal-content p {
      margin: 0;
    }

    /* Duplicate warning action button */
    .duplicate-edit-button {
      display: block;
      width: 100%;
      margin-top: 18px;
      background: var(--blue);
      color: #fff;
    }

    .duplicate-edit-button:hover:not(:disabled) {
      background: #28567e;
    }

    /* Edit wishlist popup */
    #editWishlistModal {
      background: rgba(0, 0, 0, .65);
    }

    #editWishlistModal .edit-modal-content {
      position: relative;
      width: 100%;
      max-width: 430px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 35px 28px 28px;
      color: var(--blue);
      text-align: center;
    }

    #editWishlistModal h2 {
      margin: 0 25px 12px 0;
      color: var(--red);
      font-size: 1.6em;
      line-height: 1.3;
    }

    #editWishlistModal p {
      line-height: 1.5;
    }

    #editWishlistModal .close-edit-modal {
      position: absolute;
      top: 8px;
      right: 12px;
      width: auto;
      margin: 0;
      padding: 3px 9px;
      background: transparent;
      color: #555;
      font-size: 28px;
      line-height: 1;
    }

    #editWishlistModal .close-edit-modal:hover {
      color: var(--red);
      transform: none;
    }

    #editWishlistForm {
      margin-top: 20px;
    }

    #editWishlistForm button {
      width: 100%;
      margin-top: 5px;
      background: var(--blue);
      color: #fff;
    }

    #editWishlistForm button:hover:not(:disabled) {
      background: #28567e;
    }

    #editWishlistMessage {
      min-height: 1.4em;
      margin-bottom: 0;
      font-size: .9em;
      overflow-wrap: anywhere;
    }

    @media (max-width: 768px) {
      body {
        padding: 65px 12px 24px;
        background-attachment: scroll;
      }

      h1 {
        margin: 20px 10px;
        font-size: 2em;
      }

      .container {
        width: 100%;
        max-width: 600px;
        padding: 25px;
        border-radius: 15px;
      }

      input,
      select,
      textarea {
        font-size: .95em;
      }

      .admin-login {
        top: 10px;
        right: 10px;
        font-size: .75em;
        padding: 5px 10px;
      }

      .form-buttons {
        flex-direction: column;
      }

      .form-buttons button {
        width: 100%;
      }

      .modal-content {
        padding: 24px;
        font-size: 1em;
      }
    }

    @media (max-width: 414px) {
      h1 {
        font-size: 1.6em;
      }

      .container {
        padding: 20px;
      }

      .form-buttons button {
        font-size: .9em;
        padding: 13px 8px;
      }

      #editWishlistModal .edit-modal-content {
        padding: 32px 20px 22px;
      }
    }
  </style>
</head>

<body>

  <button type="button" class="admin-login" id="adminLoginButton">
    Admin Login
  </button>

  <h1>Exchange Gift Form</h1>

  <main class="container">
    <p class="intro">
      Let the gift-giving fun begin!
      Fill in your details and tell us what you would love to receive.
    </p>

    <form id="ghoulForm">
      <div class="form-group">
        <label for="realName">Name</label>
        <input
          type="text"
          id="realName"
          name="realName"
          placeholder="Enter your Real Name"
          autocomplete="name"
          required
        >
      </div>

      <div class="form-group">
        <label for="wish1">Wishlist Entry #1</label>
        <textarea
          id="wish1"
          name="wish1"
          placeholder="Enter your most wanted gift here!"
          required
        ></textarea>
      </div>

      <div class="form-group">
        <label for="wish2">Wishlist Entry #2</label>
        <textarea
          id="wish2"
          name="wish2"
          placeholder="Your second gift alternative"
        ></textarea>
      </div>

      <div class="form-group">
        <label for="wish3">Wishlist Entry #3</label>
        <textarea
          id="wish3"
          name="wish3"
          placeholder="Your third gift alternative"
        ></textarea>
      </div>

      <div class="form-buttons">
        <button type="submit" id="submitButton">
          Save/Submit My Entry
        </button>

        <button type="button" id="editWishlistButton">
          Edit My Wishlist
        </button>
      </div>
    </form>
  </main>

  <!-- General submission and duplicate warning modal -->
  <div id="modal" class="modal" role="dialog" aria-modal="true">
    <div class="modal-content" id="modalContent">
      Saving your entry...
    </div>
  </div>

  <!-- Edit wishlist lookup modal -->
  <div
    id="editWishlistModal"
    class="modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="editWishlistTitle"
  >
    <div class="modal-content edit-modal-content">
      <button
        type="button"
        id="closeEditModal"
        class="close-edit-modal"
        aria-label="Close popup"
      >&times;</button>

      <h2 id="editWishlistTitle">Edit My Wishlist</h2>

      <p>Please enter your name to edit your existing wishlist:</p>

      <form id="editWishlistForm">
        <input
          type="text"
          id="editWishlistName"
          placeholder="Enter your real name"
          autocomplete="name"
          required
        >

        <button type="submit" id="findWishlistButton">
          Find My Wishlist
        </button>
      </form>

      <p
        id="editWishlistMessage"
        role="status"
        aria-live="polite"
      ></p>
    </div>
  </div>

  <script>
    // Google Apps Script Web App URL.
    const scriptURL =
      "https://script.google.com/macros/s/AKfycbxXeDNBzY8kOLAAa4hgnax6HYAJPBekCi8fYnwVzdkqs6v8nKKmuIWStM-fVIqXbpmYeg/exec";

    // Google Sheet URL used by the existing admin shortcut.
    const spreadsheetURL =
      "https://docs.google.com/spreadsheets/d/124LIz_k7aQ3u3Z8Om_PZnb9mxkeZtHAPsPSce2bpPl0/edit";

    const form = document.getElementById("ghoulForm");
    const submitButton = document.getElementById("submitButton");
    const editWishlistButton =
      document.getElementById("editWishlistButton");

    const modal = document.getElementById("modal");
    const modalContent = document.getElementById("modalContent");

    const editWishlistModal =
      document.getElementById("editWishlistModal");
    const closeEditModal =
      document.getElementById("closeEditModal");
    const editWishlistForm =
      document.getElementById("editWishlistForm");
    const editWishlistName =
      document.getElementById("editWishlistName");
    const editWishlistMessage =
      document.getElementById("editWishlistMessage");
    const findWishlistButton =
      document.getElementById("findWishlistButton");

    let isEditingWishlist = false;
    let originalWishlistName = "";
    let modalTimeout;

    function showStatus(message, duration = 3000) {
      modalContent.replaceChildren();

      const paragraph = document.createElement("p");
      paragraph.textContent = message;
      modalContent.appendChild(paragraph);

      modal.style.display = "flex";

      clearTimeout(modalTimeout);
      modalTimeout = setTimeout(() => {
        modal.style.display = "none";
      }, duration);
    }

    function showEditMessage(message) {
      editWishlistMessage.textContent = message;
    }

    // Look up a saved wishlist using JSONP.
    function lookupWishlist(name) {
      return new Promise((resolve, reject) => {
        const callbackName =
          "wishlistCallback_" +
          Date.now() +
          "_" +
          Math.random().toString(36).slice(2);

        const script = document.createElement("script");

        const params = new URLSearchParams({
          action: "lookup",
          name: name,
          callback: callbackName
        });

        let finished = false;

        const timeout = setTimeout(() => {
          cleanup();
          reject(
            new Error("The request timed out. Please try again.")
          );
        }, 15000);

        function cleanup() {
          if (finished) return;

          finished = true;
          clearTimeout(timeout);
          delete window[callbackName];
          script.remove();
        }

        window[callbackName] = (data) => {
          cleanup();
          resolve(data);
        };

        script.onerror = () => {
          cleanup();
          reject(
            new Error("Unable to contact the wishlist service.")
          );
        };

        script.src = scriptURL + "?" + params.toString();
        document.body.appendChild(script);
      });
    }

    // Load a retrieved wishlist into the homepage form.
    function loadWishlistIntoForm(wishlist) {
      form.elements.namedItem("realName").value =
        wishlist.realName || "";

      form.elements.namedItem("wish1").value =
        wishlist.wish1 || "";

      form.elements.namedItem("wish2").value =
        wishlist.wish2 || "";

      form.elements.namedItem("wish3").value =
        wishlist.wish3 || "";

      originalWishlistName = wishlist.realName;
      isEditingWishlist = true;

      submitButton.textContent = "Update My Wishlist";

      modal.style.display = "none";
      editWishlistModal.style.display = "none";

      form.scrollIntoView({
        behavior: "smooth",
        block: "center"
      });
    }

    // Display the duplicate warning with an Edit My Wishlist button.
    function showDuplicateWarning() {
      modalContent.replaceChildren();

      const warning = document.createElement("p");
      warning.textContent =
        "You have an existing entry. Would you like to edit that instead?";

      const editButton = document.createElement("button");
      editButton.type = "button";
      editButton.className = "duplicate-edit-button";
      editButton.textContent = "Edit My Wishlist";

      editButton.addEventListener("click", async () => {
        const name =
          form.elements.namedItem("realName").value.trim();

        if (!name) {
          showStatus("Please enter your real name first.");
          return;
        }

        editButton.disabled = true;
        editButton.textContent = "Loading Wishlist...";

        try {
          const result = await lookupWishlist(name);

          if (!result || !result.ok) {
            modalContent.replaceChildren();

            const message = document.createElement("p");
            message.textContent =
              result?.message ||
              "Unable to find your existing wishlist. Please try again.";

            modalContent.appendChild(message);
            return;
          }

          loadWishlistIntoForm(result.wishlist);

        } catch (error) {
          console.error(error);

          modalContent.replaceChildren();

          const message = document.createElement("p");
          message.textContent =
            error.message ||
            "Unable to load your wishlist. Please try again.";

          modalContent.appendChild(message);

        } finally {
          editButton.disabled = false;
          editButton.textContent = "Edit My Wishlist";
        }
      });

      modalContent.append(warning, editButton);
      modal.style.display = "flex";
    }

    // Open the homepage's Edit My Wishlist popup.
    editWishlistButton.addEventListener("click", () => {
      editWishlistForm.reset();
      showEditMessage("");

      editWishlistModal.style.display = "flex";
      editWishlistName.focus();
    });

    // Close the edit popup.
    closeEditModal.addEventListener("click", () => {
      editWishlistModal.style.display = "none";
    });

    // Close the edit popup by clicking its backdrop.
    editWishlistModal.addEventListener("click", (event) => {
      if (event.target === editWishlistModal) {
        editWishlistModal.style.display = "none";
      }
    });

    // Escape closes the edit popup.
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        editWishlistModal.style.display = "none";
      }
    });

    // Find an existing wishlist from the edit popup.
    editWishlistForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const name = editWishlistName.value.trim();

      if (!name) {
        showEditMessage("Please enter your name.");
        return;
      }

      findWishlistButton.disabled = true;
      findWishlistButton.textContent = "Checking...";
      showEditMessage("Looking for your saved wishlist...");

      try {
        const result = await lookupWishlist(name);

        if (!result || !result.ok) {
          showEditMessage(
            result?.message || "No matching entry was found."
          );
          return;
        }

        loadWishlistIntoForm(result.wishlist);

      } catch (error) {
        console.error(error);

        showEditMessage(
          error.message || "Unable to load your wishlist."
        );

      } finally {
        findWishlistButton.disabled = false;
        findWishlistButton.textContent = "Find My Wishlist";
      }
    });

    // Submit a new entry or update an existing wishlist.
    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const formData = new FormData(form);
      const wasEditing = isEditingWishlist;

      if (wasEditing) {
        formData.append("action", "update");
        formData.append("originalName", originalWishlistName);
      }

      submitButton.disabled = true;
      editWishlistButton.disabled = true;

      submitButton.textContent = wasEditing
        ? "Updating..."
        : "Submitting...";

      showStatus(
        wasEditing
          ? "Updating your wishlist..."
          : "Saving your entry...",
        30000
      );

      try {
        const response = await fetch(scriptURL, {
          method: "POST",
          body: formData
        });

        const text = (await response.text()).trim();

        // A duplicate is detected before any new row is added.
        if (text === "Duplicate" && !wasEditing) {
          clearTimeout(modalTimeout);
          showDuplicateWarning();

        } else if (text === "Success" || text === "Updated") {
          showStatus(
            wasEditing
              ? "Your wishlist has been updated!"
              : "Your entry has been saved!",
            2500
          );

          form.reset();

          isEditingWishlist = false;
          originalWishlistName = "";

          submitButton.textContent = "Submit My Entry!";

        } else {
          throw new Error(
            text || "The server returned an unexpected response."
          );
        }

      } catch (error) {
        console.error(error);

        showStatus(
          "Something went wrong while saving your entry. Please try again.",
          4000
        );

      } finally {
        submitButton.disabled = false;
        editWishlistButton.disabled = false;

        submitButton.textContent = isEditingWishlist
          ? "Update My Wishlist"
          : "Submit My Entry!";
      }
    });

    // Existing admin shortcut.
    document
      .getElementById("adminLoginButton")
      .addEventListener("click", () => {
        const password = prompt("Enter admin password:");

        if (password === "gips2025") {
          window.open(
            spreadsheetURL,
            "_blank",
            "noopener"
          );
        } else if (password !== null) {
          alert("Incorrect password.");
        }
      });
  </script>
</body>
</html>
